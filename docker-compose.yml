# Connect to a PostgreSQL service managed by Coolify using DATABASE_URL.
services:
  web:
    build: .
    image: sparecash:local
    restart: unless-stopped
    environment: &app_environment
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Set OWNER_PASSWORD}
    expose:
      - "3000"
  worker:
    image: sparecash:local
    restart: unless-stopped
    environment: *app_environment
    command: ["node", "dist/server/worker.js"]
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy
